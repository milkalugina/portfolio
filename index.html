    <style>
        body {
            margin: 0;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-weight: 400;
            letter-spacing: -0.02em;
            -webkit-font-smoothing: antialiased;
            background: #ffffff;
            color: #1a1a1a;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 21px 0;
            gap: 24px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .brand img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        .brand span {
            font-size: 16px;
            line-height: 0.95;
            color: #222222;
            white-space: nowrap;
        }

        .nav {
            display: inline-flex;
            align-items: center;
            gap: 16px;
        }

        .nav a {
            font-size: 18px;
            line-height: 0.95;
            color: #1a1a1a;
            white-space: nowrap;
        }

        .nav .is-active {
            background: #1a1a1a;
            color: #ffffff;
            padding: 6px 14px;
        }

        .status {
            font-size: 16px;
            line-height: 0.95;
            color: #222222;
            white-space: nowrap;
        }

        .intro {
            max-width: 640px;
            margin: 80px auto 48px;
            padding: 0 21px;
            text-align: center;
            color: rgba(34, 34, 34, 0.6);
            font-size: 16px;
            line-height: 1.4;
        }

        .intro a {
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .year {
            margin: 24px 4px 8px;
            font-size: 16px;
            color: rgba(34, 34, 34, 0.45);
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            padding: 0 2px 40px;
        }

        .gallery img {
            width: 19.7%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        @media (max-width: 1024px) {
            .gallery img {
                width: calc(50% - 1px);
            }
        }

        @media (max-width: 700px) {
            .site-header {
                padding: 13px 14px 0;
            }

            .brand span,
            .status {
                display: none;
            }

            .intro {
                margin: 48px auto 32px;
                padding: 0 14px;
                text-align: left;
            }

            .gallery img {
                width: 100%;
            }
        }
    </style>
</head>
