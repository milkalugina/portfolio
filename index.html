<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life things — Mila Kalugina</title>
    <link rel="shortcut icon" href="images/favicon.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libertinus+Math&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f4f4;
            color: #1a1a1a;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-weight: 400;
            letter-spacing: -0.02em;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            column-gap: 2px;
        }

        .site-header {
            align-items: center;
            padding-top: 24px;
            padding-bottom: 0;
        }

        .brand {
            grid-column: 1;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding-left: 21px;
            min-width: 0;
        }

        .brand img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            flex-shrink: 0;
        }

        .brand span {
            font-size: 16px;
            line-height: 0.95;
            color: #222222;
            white-space: nowrap;
        }

        .nav {
            grid-column: 2 / 4;
            display: inline-flex;
            align-items: center;
            gap: 16px;
            padding: 5px 0;
            justify-self: start;
        }

        .nav a {
            font-size: 18px;
            line-height: 0.95;
            color: #1a1a1a;
            white-space: nowrap;
        }

        .nav .is-active {
            background: #1a1a1a;
            color: #ffffff;
            padding: 6px 14px;
        }

        .nav .disabled {
            pointer-events: none;
            opacity: 0.35;
            cursor: not-allowed;
        }

        .status {
            grid-column: 4;
            justify-self: end;
            padding-right: 21px;
            font-size: 16px;
            line-height: 0.95;
            color: #222222;
            white-space: nowrap;
        }

        .year-block {
            align-items: start;
            margin-top: 80px;
            margin-bottom: 24px;
            padding-right: 0;
        }

        .year-block:first-of-type {
            margin-top: 100px;
        }

        .year {
            grid-column: 1;
            margin: 0;
            padding: 14px 20px 0 20px;
            font-family: "Libertinus Math", "Times New Roman", serif;
            font-size: 46px;
            font-weight: 400;
            line-height: 1.05;
            letter-spacing: -0.02em;
            color: #0d0d0d;
        }

        .gallery {
            grid-column: 2 / -1;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 2px;
            min-width: 0;
        }

        .gallery img {
            width: calc((100% - 10px) / 6);
            height: auto;
            display: block;
            flex: 0 0 calc((100% - 10px) / 6);
            object-fit: unset;
        }

        @media (max-width: 1024px) {
            .gallery img {
                width: calc((100% - 6px) / 4);
                flex: 0 0 calc((100% - 6px) / 4);
            }
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .nav {
                grid-column: 1 / -1;
                padding-left: 21px;
            }

            .status {
                grid-column: 2;
            }

            .year {
                grid-column: 1 / -1;
                padding: 0 14px 12px;
                font-size: 36px;
            }

            .gallery {
                grid-column: 1 / -1;
                padding: 0 14px;
            }

            .gallery img {
                width: calc((100% - 4px) / 3);
                flex: 0 0 calc((100% - 4px) / 3);
            }
        }

        @media (max-width: 700px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .site-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 13px 14px 0;
            }

            .brand {
                padding-left: 0;
            }

            .brand span,
            .status {
                display: none;
            }

            .nav {
                padding: 5px 0;
            }

            .year-block {
                margin-top: 48px;
            }

            .year-block:first-of-type {
                margin-top: 40px;
            }

            .year {
                font-size: 32px;
                padding: 0 14px 10px;
            }

            .gallery {
                padding: 0 14px;
            }

            .gallery img {
                width: calc((100% - 2px) / 2);
                flex: 0 0 calc((100% - 2px) / 2);
            }
        }
    </style>
</head>
